services:
  rydesync:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IMAGE_NAME:-aerovista-rydesync:alpha7}"
    container_name: "${CONTAINER_NAME:-rydesync}"
    restart: unless-stopped
    env_file:
      - "${RYDESYNC_ENV_FILE:-/etc/acos-secrets/rydesync.env}"
    environment:
      NODE_ENV: production
      PORT: "9000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:9000"
    networks:
      - gateway
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  gateway:
    name: "${COMPOSE_NETWORK:-gateway}"
    external: true
