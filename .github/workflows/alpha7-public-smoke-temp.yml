name: Alpha7 Public Smoke Temp

on:
  pull_request:
    branches:
      - upgrade/alpha7-global-foundation

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose public edge responses
        shell: bash
        run: |
          set -euo pipefail
          base='https://rydesync.aerovista.us'
          mkdir -p /tmp/rydesync-smoke

          for path in /health /v1/bootstrap /; do
            key="$(printf '%s' "$path" | tr '/?' '__')"
            headers="/tmp/rydesync-smoke/${key}.headers"
            body="/tmp/rydesync-smoke/${key}.body"
            status="$(curl --silent --show-error --location \
              --user-agent 'Mozilla/5.0 (compatible; AeroVista-RydeSync-Synthetic-Smoke/1.0)' \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              "$base$path" || true)"

            echo "=== $path ==="
            echo "status=$status"
            grep -iE '^(server:|cf-ray:|location:|content-type:|www-authenticate:)' "$headers" || true
            echo "body-preview:"
            head -c 240 "$body" | tr '\n' ' ' || true
            echo
            echo
          done

          health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/health" || true)"
          bootstrap_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/v1/bootstrap" || true)"
          root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/" || true)"

          # This diagnostic is intentionally non-mutating. A 403 from all public
          # paths records an edge-policy limitation for hosted CI rather than
          # pretending an application response was tested.
          if [[ "$health_status" == 200 && "$bootstrap_status" == 200 && "$root_status" == 200 ]]; then
            health="$(curl --fail --silent --show-error "$base/health")"
            bootstrap="$(curl --fail --silent --show-error "$base/v1/bootstrap")"
            root="$(curl --fail --silent --show-error "$base/")"

            printf '%s' "$health" | jq -e '.ok == true and .service == "rydesync" and .version == "3.0.0-alpha.7"' >/dev/null
            printf '%s' "$bootstrap" | jq -e '
              .service == "rydesync" and
              .version == "3.0.0-alpha.7" and
              .identity.loginConfigured == true and
              .identity.loginPath == "/auth/login" and
              .features.echoverseEntitlementGate == true and
              .features.pushToTalk == true and
              .features.turnReady == false and
              .voice.enabled == true and
              .voice.turnConfigured == false and
              (.voice.iceServers | length) >= 1
            ' >/dev/null
            grep -q 'RydeSync' <<<"$root"
            grep -qi 'EchoVerse' <<<"$root"
            echo 'PUBLIC_APPLICATION_SMOKE=PASS'
          else
            echo "PUBLIC_APPLICATION_SMOKE=EDGE_BLOCKED health=$health_status bootstrap=$bootstrap_status root=$root_status"
          fi
