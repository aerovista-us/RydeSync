<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#071014" />
  <title>RydeSync · Offline</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9fbff;background:#071014;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,rgba(0,216,255,.12),transparent 32%),#071014}.offline{width:min(560px,calc(100% - 32px));padding:34px;border:1px solid #1d4650;border-radius:22px;background:rgba(8,22,27,.96);box-shadow:0 24px 90px rgba(0,0,0,.35)}.eyebrow{font-size:10px;letter-spacing:.22em;color:#66b5c5;font-weight:800}.mark{width:58px;height:58px;margin-bottom:24px;display:grid;place-items:center;transform:rotate(45deg);border:1px solid #14d9ff;border-radius:16px;background:#0b252c;color:#14d9ff;font-weight:950;font-size:24px}.mark span{transform:rotate(-45deg)}h1{margin:9px 0 12px;font-size:clamp(30px,7vw,52px);letter-spacing:-.04em}p{margin:0 0 22px;color:#88adb6;line-height:1.6}button,a{display:inline-block;margin-right:8px;border:1px solid #31525d;border-radius:10px;padding:11px 14px;background:#14d9ff;color:#031013;font-weight:900;text-decoration:none;cursor:pointer}a{background:#162b31;color:#dff8fb}
  </style>
</head>
<body>
  <main class="offline">
    <div class="mark"><span>R</span></div>
    <div class="eyebrow">RYDESYNC // CONNECTION LOST</div>
    <h1>You’re temporarily offline.</h1>
    <p>The installed shell is still available, but live rooms, crew position, PTT signaling, identity, and shared music require the RydeSync service. Nothing sensitive is replayed from cache.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/#dashboard">Open Dashboard</a>
  </main>
</body>
</html>
